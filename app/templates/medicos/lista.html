{% extends "base.html" %}
{% block title %}Médicos · MediControl{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Médicos</h2>
    <a href="{{ url_for('medicos.crear') }}" class="btn btn-primary">+ Nuevo médico</a>
</div>
<div class="table-responsive bg-white rounded shadow-sm">
<table class="table table-hover align-middle mb-0">
    <thead class="table-primary"><tr><th>ID</th><th>Nombre</th><th>Especialidad</th><th class="text-end">Acciones</th></tr></thead>
    <tbody>
    {% for m in medicos %}
        <tr>
            <td>{{ m.id }}</td><td>{{ m.nombre }}</td><td>{{ m.especialidad }}</td>
            <td class="text-end">
                <a href="{{ url_for('medicos.editar', id=m.id) }}" class="btn btn-sm btn-warning">Editar</a>
                <form action="{{ url_for('medicos.eliminar', id=m.id) }}" method="post" class="d-inline"
                      onsubmit="return confirm('¿Eliminar al médico y sus citas?');">
                    <button class="btn btn-sm btn-danger">Eliminar</button>
                </form>
            </td>
        </tr>
    {% else %}
        <tr><td colspan="4" class="text-center text-muted py-4">No hay médicos registrados.</td></tr>
    {% endfor %}
    </tbody>
</table>
</div>
{% endblock %}
