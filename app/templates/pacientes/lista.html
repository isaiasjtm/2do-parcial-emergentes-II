{% extends "base.html" %}
{% block title %}Pacientes · MediControl{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Pacientes</h2>
    <a href="{{ url_for('pacientes.crear') }}" class="btn btn-success">+ Nuevo paciente</a>
</div>
<div class="table-responsive bg-white rounded shadow-sm">
<table class="table table-hover align-middle mb-0">
    <thead class="table-success"><tr><th>ID</th><th>Nombre</th><th>Teléfono</th><th class="text-end">Acciones</th></tr></thead>
    <tbody>
    {% for p in pacientes %}
        <tr>
            <td>{{ p.id }}</td><td>{{ p.nombre }}</td><td>{{ p.telefono }}</td>
            <td class="text-end">
                <a href="{{ url_for('pacientes.editar', id=p.id) }}" class="btn btn-sm btn-warning">Editar</a>
                <form action="{{ url_for('pacientes.eliminar', id=p.id) }}" method="post" class="d-inline"
                      onsubmit="return confirm('¿Eliminar al paciente y sus citas?');">
                    <button class="btn btn-sm btn-danger">Eliminar</button>
                </form>
            </td>
        </tr>
    {% else %}
        <tr><td colspan="4" class="text-center text-muted py-4">No hay pacientes registrados.</td></tr>
    {% endfor %}
    </tbody>
</table>
</div>
{% endblock %}
